<!DOCTYPE html>
<html lang="ro"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Șantier — SHC Solar Suite</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;background:#090f1c;color:#e2e8f0;}

/* ── Login ── */
#loginOverlay{position:fixed;inset:0;z-index:9999;background:#090f1c;display:flex;align-items:center;justify-content:center;}
.pin-dot{width:15px;height:15px;border-radius:50%;border:2px solid #f59e0b;background:transparent;transition:background .15s;}
.pin-dot.filled{background:#f59e0b;}
.pin-dot.err{border-color:#ef4444;background:#ef4444;}
.pin-key{width:72px;height:72px;border-radius:50%;border:1px solid #334155;background:#1e293b;color:#f1f5f9;font-size:22px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .25s;}
.pin-key:active,.pin-key.pin-key-pressed{background:#7f1d1d;}
.login-card{background:#111827;border:1px solid #1e3a5f;border-radius:16px;padding:36px 32px;width:380px;max-width:92vw;box-shadow:0 8px 40px rgba(0,0,0,.5);}
.form-label{font-size:11px;font-weight:700;color:#475569;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.form-select,.form-input{width:100%;padding:10px 13px;border:1.5px solid #334155;border-radius:10px;font-size:14px;font-family:inherit;background:#1e293b;color:#f1f5f9;outline:none;}
.form-select:focus,.form-input:focus{border-color:#3b82f6;}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-login:hover{opacity:.9;}

/* ── App layout ── */
body.embedded #app{height:100%;}
#app{display:none;height:100vh;flex-direction:column;}
body.embedded #topBar{display:none!important;}
#topBar{background:#0d1b2e;border-bottom:1px solid #1e3a5f;padding:0 18px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;}
#layout{display:flex;flex:1;overflow:hidden;position:relative;}
.hamburger{display:none;}
.sidebar-backdrop{display:none;}
.sidebar-backdrop.show{display:block;}
@media(max-width:768px){
  #sidebar{position:fixed!important;left:0;top:0;height:100%!important;z-index:300;transform:translateX(-105%);transition:transform .25s cubic-bezier(.16,1,.3,1);width:82vw!important;max-width:300px;}
  #sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:290;}
  .hamburger{display:flex!important;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid #334155;border-radius:8px;background:transparent;cursor:pointer;flex:none;color:#94a3b8;}
  #topBar{padding:0 10px!important;gap:6px!important;}
  #ganttControls{padding:8px 8px!important;gap:6px!important;}
  #viewLabel{min-width:0!important;font-size:11px!important;}
  #userName{display:none;}
}

/* ── Sidebar ── */
#sidebar{width:256px;background:#0d1b2e;border-right:1px solid #1e3a5f;display:flex;flex-direction:column;flex-shrink:0;}
#sidebarHeader{padding:12px;border-bottom:1px solid #1e3a5f;display:flex;flex-direction:column;gap:6px;}
#projectList{max-height:260px;overflow-y:auto;padding:6px 0;}
#appFooter canvas{display:block;}
.proj-item{padding:9px 14px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:10px;transition:background .1s;}
.proj-item:hover{background:rgba(59,130,246,.08);}
.proj-item.active{background:rgba(59,130,246,.12);border-left-color:#3b82f6;}
.proj-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.proj-name{font-size:13px;font-weight:600;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.proj-client{font-size:11px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Main ── */
#main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#ganttControls{padding:8px 14px;background:#0d1b2e;border-bottom:1px solid #1e3a5f;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
#ganttWrap{flex:1;overflow:auto;position:relative;}

/* ── Gantt table ── */
#ganttTable{border-collapse:collapse;table-layout:fixed;}
.gantt-th-label{background:#0d1b2e;position:sticky;left:0;z-index:10;padding:6px 12px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;width:240px;min-width:240px;border-right:1px solid #1e3a5f;border-bottom:1px solid #1e3a5f;}
.gantt-th-month{background:#0d1b2e;padding:6px 4px;font-size:11px;font-weight:700;color:#94a3b8;text-align:center;border-bottom:1px solid #1e3a5f;white-space:nowrap;border-right:1px solid rgba(30,58,95,.4);}
.gantt-td-label{background:#090f1c;position:sticky;left:0;z-index:5;padding:5px 10px;border-right:1px solid #1e3a5f;border-bottom:1px solid rgba(30,58,95,.35);width:240px;min-width:240px;max-width:240px;}
.gantt-td-cell{background:#090f1c;border-bottom:1px solid rgba(30,58,95,.35);position:relative;}
.proj-row .gantt-td-label{background:#0d1b2e;}
.proj-row .gantt-td-cell{background:#0d1b2e;}
.proj-label{font-size:12px;font-weight:700;color:#e2e8f0;display:flex;align-items:center;gap:6px;user-select:none;}
.stage-label{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:5px;padding-left:14px;}
.gantt-bar{position:absolute;top:5px;height:22px;border-radius:5px;cursor:pointer;display:flex;align-items:center;padding:0 7px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.gantt-bar:hover{filter:brightness(1.15);}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:8;pointer-events:none;}
.today-label{position:absolute;top:1px;left:4px;font-size:8px;font-weight:800;color:#ef4444;white-space:nowrap;}

/* ── Buttons ── */
.btn{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid transparent;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-blue{background:#2563eb;color:#fff;}
.btn-green{background:#16a34a;color:#fff;}
.btn-ghost{background:transparent;color:#94a3b8;border-color:#334155;}
.btn-red{background:#dc2626;color:#fff;}
.btn-sm{padding:4px 9px;font-size:11px;border-radius:6px;}
.btn-icon{padding:3px 7px;font-size:11px;border-radius:5px;}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-card{background:#111827;border:1px solid #1e3a5f;border-radius:14px;padding:26px 28px;width:480px;max-width:96vw;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:800;color:#f1f5f9;margin-bottom:18px;}
.field{margin-bottom:12px;}
.field label{font-size:10px;font-weight:700;color:#475569;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid #334155;border-radius:8px;font-size:13px;font-family:inherit;background:#1e293b;color:#f1f5f9;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#3b82f6;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;}
.badge-red{background:rgba(239,68,68,.15);color:#f87171;}
.badge-yellow{background:rgba(234,179,8,.15);color:#fbbf24;}
.badge-green{background:rgba(34,197,94,.15);color:#4ade80;}
.badge-blue{background:rgba(59,130,246,.15);color:#60a5fa;}

/* ── Empty ── */
.empty-state{padding:70px 20px;text-align:center;color:#334155;}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#1e3a5f;border-radius:3px;}

a{color:#60a5fa;}
a:hover{color:#93c5fd;}
[style*="cursor:pointer"], [style*="cursor: pointer"] { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:rgba(0,0,0,0.06); }

#shellTop{background:#0d1b2e;border-bottom:1px solid #1e3a5f;padding:0 18px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;}
#shellApp{display:none;height:100vh;flex-direction:column;}
.seg{display:flex;gap:3px;background:#0a1628;border-radius:9px;padding:3px;}
.seg-btn{padding:6px 16px;border:0;background:transparent;color:#94a3b8;font-size:12.5px;font-weight:600;border-radius:7px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .12s,color .12s;}
.seg-btn:hover{background:#132741;color:#cbd5e1;}
.seg-btn.active{background:#1e3a5f;color:#f1f5f9;font-weight:700;}
#frames{flex:1;position:relative;overflow:hidden;}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;}
#frames iframe.show{display:block;}
@media(max-width:768px){#shellTop{padding:0 10px;gap:6px;}.seg-btn{padding:6px 11px;font-size:11.5px;}#shellUserName{display:none;}}
</style>
</head>

<script>
const DEFAULT_USERS = [
  {id:'_admin',    name:'Administrator',    color:'#dc2626', password:'12345'},
  {id:'u_nicoras', name:'Ionut Nicoras',    color:'#d97706', password:'12345'},
  {id:'u_chirila', name:'Alexandru Chirila',color:'#7c3aed', password:'12345'},
  {id:'u_dobre',   name:'Cristian Dobre',   color:'#16a34a', password:'12345'},
  {id:'u_sirb',    name:'Beniamin Sirb',    color:'#0891b2', password:'12345'},
];


let db=null, currentUser=null, loginUsers=[...DEFAULT_USERS], adminPw='12345', adminPin='1000';
let officePinBuffer='';
function initials(n){ return (n||'').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
const FB_CONFIG = {
  apiKey: "AIzaSyBVElgXbEabUcwjNMa27IEw0YkxaEaXYl0",
  authDomain: "solarcrm-ba919.firebaseapp.com",
  databaseURL: "https://solarcrm-ba919-default-rtdb.firebaseio.com",
  projectId: "solarcrm-ba919",
  storageBucket: "solarcrm-ba919.firebasestorage.app",
  messagingSenderId: "349523166308",
  appId: "1:349523166308:web:0533aa1dae74f9a0b3cb71"
};
function loadFirebase(){
  try{
    if(typeof firebase==='undefined') return;
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    db=firebase.database();
  }catch(e){ return; }
  if(!db) return;
  db.ref('solarcrm_v2/config').once('value', snap=>{
    const cfg=snap.val()||{};
    if(cfg.users&&Array.isArray(cfg.users)&&cfg.users.length) loginUsers=cfg.users;
    if(cfg.adminPw) adminPw=cfg.adminPw;
    if(cfg.adminPin) adminPin=cfg.adminPin;
    populateLoginUsers();
    buildOfficePinGrid();
  });
}
function shcGetLock(){try{return JSON.parse(localStorage.getItem('shc_lock_planificare')||'{"fails":0,"until":0}');}catch(e){return{fails:0,until:0};}}
function shcSetLock(s){localStorage.setItem('shc_lock_planificare',JSON.stringify(s));}
function shcIsLocked(){return shcGetLock().until>Date.now();}
function shcLockSecondsLeft(){return Math.max(0,Math.ceil((shcGetLock().until-Date.now())/1000));}
function shcRegisterFail(){const s=shcGetLock();s.fails=(s.fails||0)+1;if(s.fails>=5){s.until=Date.now()+30000;s.fails=0;}shcSetLock(s);}
function shcRegisterSuccess(){shcSetLock({fails:0,until:0});}
let shcLockInterval=null;
function shcShowLockCountdown(){
  const errEl=document.getElementById('officePinErr');
  const grid=document.getElementById('officePinGrid');
  if(grid) grid.querySelectorAll('button').forEach(b=>b.disabled=true);
  clearInterval(shcLockInterval);
  shcLockInterval=setInterval(()=>{
    const left=shcLockSecondsLeft();
    if(left<=0){ clearInterval(shcLockInterval); if(errEl) errEl.textContent=''; if(grid) grid.querySelectorAll('button').forEach(b=>b.disabled=false); return; }
    if(errEl) errEl.textContent='Prea multe încercări greșite — blocat '+left+'s';
  },500);
}

function shcAudit(user,role){
  try{ if(db) db.ref('solarcrm_v2/audit_log').push({t:Date.now(),app:'Șantier',user:user,role:role||''}); }catch(e){}
}
let shcIdleTimer=null;
function shcResetIdle(){
  clearTimeout(shcIdleTimer);
  shcIdleTimer=setTimeout(()=>{ if(currentUser){ const b=document.getElementById('btnLogout'); if(b) b.click(); } },20*60*1000);
}
['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,shcResetIdle,{passive:true}));
shcResetIdle();
function populateLoginUsers(){
  const sel=document.getElementById('loginUser');
  const cur=sel.value;
  sel.innerHTML='<option value="">— Selectează utilizatorul —</option>';
  // Doar Administrator, Chirila și Nicoraș se pot loga cu parolă — restul folosesc PIN rapid
  loginUsers.filter(u=>u.id==='_admin'||u.id==='u_chirila'||u.id==='u_nicoras').forEach(u=>{
    const o=document.createElement('option');
    o.value=u.id; o.textContent=u.name+(u.role?' — '+u.role:'');
    sel.appendChild(o);
  });
  if(cur) sel.value=cur;
}


function doLogin(){
  const uid2=document.getElementById('loginUser').value;
  const pw=document.getElementById('loginPassword').value;
  const err=document.getElementById('loginError');
  if(!uid2){err.textContent='Selectează un utilizator.';return;}
  const u=loginUsers.find(x=>x.id===uid2);
  if(!u){err.textContent='Utilizator negăsit.';return;}
  const stored=u.id==='_admin'?adminPw:(u.password||'');
  if(stored&&pw!==stored){err.textContent='Parolă incorectă.';return;}
  if(u.apps && u.apps.planificare===false){ err.textContent='Nu ai acces la Planificare Șantier. Contactează administratorul.'; return; }
  completeLoginAs(u);
}

function renderOfficePinDots(err){
  const wrap=document.getElementById('officePinDots'); wrap.innerHTML='';
  for(let i=0;i<4;i++){
    const d=document.createElement('div');
    d.className='pin-dot'+(i<officePinBuffer.length?(err?' err':' filled'):'');
    wrap.appendChild(d);
  }
}
function buildOfficePinGrid(){
  const grid=document.getElementById('officePinGrid'); grid.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','clear','0','del'].forEach(k=>{
    const b=document.createElement('button'); b.className='pin-key'; b.type='button';
    b.textContent=k==='del'?'⌫':(k==='clear'?'C':k);
    b.addEventListener('click',()=>{ b.classList.add('pin-key-pressed'); setTimeout(()=>b.classList.remove('pin-key-pressed'),250); officePinPress(k); });
    grid.appendChild(b);
  });
}
function officePinPress(k){
  if(shcIsLocked()){ shcShowLockCountdown(); return; }
  document.getElementById('officePinErr').textContent='';
  if(k==='del'){ officePinBuffer=officePinBuffer.slice(0,-1); renderOfficePinDots(false); return; }
  if(k==='clear'){ officePinBuffer=''; renderOfficePinDots(false); return; }
  if(officePinBuffer.length>=4) return;
  officePinBuffer+=k; renderOfficePinDots(false);
  if(officePinBuffer.length===4){
    const u=loginUsers.find(x=>x.pin===officePinBuffer) || (adminPin&&adminPin===officePinBuffer?{id:'_admin',name:'Administrator',role:'Admin',color:'#dc2626'}:null);
    if(!u){
      shcRegisterFail();
      renderOfficePinDots(true);
      if(shcIsLocked()){ officePinBuffer=''; renderOfficePinDots(false); shcShowLockCountdown(); return; }
      document.getElementById('officePinErr').textContent='Cod greșit — încearcă din nou';
      setTimeout(()=>{ officePinBuffer=''; renderOfficePinDots(false); },900);
      return;
    }
    if(u.apps && u.apps.planificare===false){
      renderOfficePinDots(true);
      document.getElementById('officePinErr').textContent='Nu ai acces la Planificare Șantier.';
      setTimeout(()=>{ officePinBuffer=''; renderOfficePinDots(false); },1200);
      return;
    }
    shcRegisterSuccess(); shcAudit(u.name,u.role||'');
    officePinBuffer='';
    document.getElementById('officePinOverlay').style.display='none';
    completeLoginAs(u);
  }
}

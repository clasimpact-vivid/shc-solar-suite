name: Rezumat zilnic SHC Solar Suite (18:00)

on:
  # Dezactivat — rulează doar cel de dimineață (daily-emails.yml), pentru a evita duplicarea
  # schedule:
  #   - cron: '0 15 * * 1-5'
  workflow_dispatch: {}

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Trimite rezumatul zilnic
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/send-daily-summary.js

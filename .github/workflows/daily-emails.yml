name: Notificări email zilnice SHC Solar Suite

on:
  # Declanșat la ora fixă de Cloudflare (shc-cron-trigger). Programarea GitHub e oprită ca să nu dubleze.
  workflow_dispatch: {}

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Trimite emailurile zilnice
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/send-daily-emails.js
